  <!--
    Parkett: a basketweave parquet floor, the rounded tile Linux and macOS show as drawn.
    Four tiles of three planks, each tile turned from its neighbours, edge
    to edge, light and dark planks on the darker brown of the joints.

    Author: David M. Anderson
    Built with AI assistance (Claude, Anthropic)

    This comment sits inside the element because gdk-pixbuf looks for
    <svg in the first 256 bytes and refuses a file where it comes later.
  -->
