[locales."de-de"]
website = "https://github.com/excelano/parkett"
support = "https://github.com/excelano/parkett/issues"
privacy = "https://excelano.com/legal/#parkett"
description = """
Parquet ist das Format, in dem Daten zwischen Spark, pandas, DuckDB, Data Warehouses und Pipelines wandern: spaltenorientiert, komprimiert, typisiert und ohne ein Programm nicht lesbar. Parkett ist dieses Programm, zum Ansehen. Öffnen Sie eine Datei, und ihre Zeilen sind da, Millionen davon, in einem Raster, das so schnell scrollt, wie das Fenster zeichnen kann.

WAS ES ZEIGT
Jede Zeile, in einem Raster mit Name und Typ jeder Spalte darüber. Werte in der Form, die ihr Typ ihnen gibt: Zeitstempel in ihrer Zeitzone und in der Genauigkeit ihrer Einheit, Dezimalzahlen mit ihren Nachkommastellen, Datumsangaben als Datum, Binärdaten hexadezimal, Listen, Strukturen und Maps als JSON. Null ist eine blasse Markierung und wird nie mit einer leeren Zeichenkette verwechselt. Wählen Sie eine Zelle aus, und ihr ganzer Wert erscheint unter dem Raster, ein verschachtelter eingerückt.

WAS DIE DATEI ÜBER SICH SAGT
Neben dem Raster, auf Wunsch, der Dateifuß: das Schema als Baum mit Typ und Nullbarkeit jedes Felds, die Zeilenzahl, die Zeilengruppen und ihre Größen, das schreibende Programm, die Metadaten des Erzeugers und für jede Spalte ihr Codec, ihre Kodierungen, ihre komprimierte und unkomprimierte Größe sowie Minimum, Maximum und Anzahl der Nullwerte aus ihren Statistiken.

WIE ES LIEST
Nur den Teil der Datei, der zu sehen ist, in Blöcken auf anderen Threads entschlüsselt. Eine Datei mit Millionen Zeilen öffnet sofort, und der Sprung zur letzten Zeile dauert einen Moment statt einer Minute. Snappy, gzip, Brotli, LZ4 und Zstandard werden gelesen.

KOPIEREN UND EXPORTIEREN
Wählen Sie eine Zelle, einen Bereich, eine Spalte oder die ganze Datei aus. Kopieren übergibt einen Bereich als tabulatorgetrennte Zeilen, die sich in einer Tabellenkalkulation als Zellen einfügen. Der Export schreibt jede Zeile oder die ausgewählten Spalten als CSV, mit Zeitstempeln in ISO 8601, damit eine Tabellenkalkulation sie als Datum erkennt, und Öffnen übergibt die fertige Datei dem Programm, das auf Ihrem Rechner CSV öffnet.

WAS ES NICHT TUT
Es schreibt nie Parquet und verändert nie die geöffnete Datei. Keinerlei Netzwerkverbindung, kein Konto, keine Telemetrie, keine Einstellungsdatei und kein Verlauf. Es sortiert, filtert und fragt nicht ab; es zeigt die Datei, wie sie ist.

Auf Deutsch und Englisch.

OPEN SOURCE
Parkett ist Open Source unter der MIT-Lizenz: github.com/excelano/parkett.
"""

