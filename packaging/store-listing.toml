apple-review-notes = """
Parkett is a viewer for Apache Parquet files, the columnar data format of Spark, pandas, DuckDB and most data pipelines. It opens a file as a grid of its rows and, under View, File details, a panel describing the file itself.

To review it, open any .parquet file with File, Open, or double-click one in Finder: the bundle imports the type org.apache.parquet and claims it as a viewer. A sample file is in the repository at packaging/demo/observations.parquet: https://github.com/excelano/parkett/raw/main/packaging/demo/observations.parquet

Things to try: scroll, select cells with the arrow keys or the pointer, Shift to extend a selection, Cmd+C to copy it, Cmd+I for the file details, and File, Export as CSV, whose Open button hands the finished file to the application registered for CSV.

The App Sandbox is on with two entitlements: the sandbox itself and read-write access to user-selected files. Parkett never writes to the Parquet file it opened. An export is written to the location chosen in the save panel; replacing an existing file goes through NSFileManager's replaceItemAtURL from the item replacement directory, so nothing is created beside it.

Parkett makes no network connection, keeps no settings or history, and collects nothing.
"""

microsoft-review-notes = """
Parkett is a viewer for Apache Parquet files. Open any .parquet file with File, Open; the package associates the extension and adds Parkett under Open With. A sample file is at https://github.com/excelano/parkett/raw/main/packaging/demo/observations.parquet

The optional "Blocked executables" test fails and the kit's overall result is PASS. kernel32.dll!CreateProcessW and the "cmd.exe" strings are the Rust standard library's process module, linked in because the GUI framework uses the webbrowser crate to open hyperlinks. shell32.dll!ShellExecuteW is the opener crate, which the export's Open button uses to hand a finished CSV to the application Windows has registered for CSV. Parkett starts no other process.

The executable links the Visual C++ runtime statically and imports only DLLs that ship with Windows. It makes no network connection and keeps no settings or history.
"""

[locales."en-us"]
website = "https://github.com/excelano/parkett"
support = "https://github.com/excelano/parkett/issues"
privacy = "https://excelano.com/legal/#parkett"
description = """
Parquet is how data moves between Spark, pandas, DuckDB, warehouses and pipelines: columnar, compressed, typed, and unreadable without a program. Parkett is that program, for looking. Open a file and its rows are there, millions of them, in a grid that scrolls as fast as the window can draw.

WHAT IT SHOWS
Every row, in a grid with each column's name and type above it. Values in the form their type gives them: timestamps in their time zone to their unit's precision, decimals with their scale, dates as dates, binary as hexadecimal, lists, structs and maps as JSON. Null is a faint mark, so it is never mistaken for an empty string. Select a cell and its whole value appears beneath the grid, a nested one laid out.

WHAT THE FILE SAYS ABOUT ITSELF
Beside the grid, on request, the footer: the schema as a tree with each field's type and nullability, the row count, the row groups and their sizes, the writer, the metadata the producer stored, and for every column its codec, encodings, compressed and uncompressed size, and the minimum, maximum and null count its statistics record.

HOW IT READS
Only the stretch of the file in view, decoded in blocks on other threads, so a file of millions of rows opens at once and a jump to its last row takes a moment rather than a minute. Snappy, gzip, Brotli, LZ4 and Zstandard are all read.

COPY AND EXPORT
Select a cell, a range, a column or the whole file. Copy hands a range over as tab-separated rows that paste into a spreadsheet as cells. Export writes every row, or the columns selected, as CSV, with timestamps in ISO 8601 so a spreadsheet takes them as dates, and Open hands the finished file to whatever opens CSV on your machine.

WHAT IT DOES NOT DO
It never writes Parquet and never changes the file it opened. No network connection of any kind, no account, no telemetry, no settings file or history. It does not sort, filter or run queries; it shows the file as it is.

In English and German.

OPEN SOURCE
Parkett is open source under the MIT licence: github.com/excelano/parkett.
"""

