[package]
name = "parkett"
description = "View Apache Parquet files"
readme = "README.md"
keywords = ["parquet", "viewer", "data", "gui", "egui"]
categories = ["gui", "visualization"]
version = "0.1.0"
edition = "2024"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/parkett"
# eframe's floor, not this code's.
rust-version = "1.95"

[[bin]]
name = "parkett"
path = "src/main.rs"

[dependencies]
# Default features: the Arrow reader and every codec. Zstandard compiles C;
# DESIGN.md §2.
parquet = "60.0.0"
# `chrono-tz` for timestamps in a named zone. DESIGN.md §5.
arrow-array = { version = "60.0.0", features = ["chrono-tz"] }
arrow-schema = "60.0.0"
arrow-select = "60.0.0"
eframe = "0.36"
portal-theme = "0.1"
rfd = "0.17"
# Reads the `.po` catalogues in `po/`, compiled in. DESIGN.md §9.
potext = "0.1"
# Hands an exported file to whatever the platform opens it with.
opener = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
# Decodes the window icon carried in the binary; Windows takes a window's icon
# from a resource, and the build compiles none.
ico = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Replacing a file a person chose, the App Sandbox's way (src/staging.rs), and
# receiving the document Finder opens as an Apple Event (src/opened_document.rs).
block2 = "0.6"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSFileManager", "NSPathUtilities", "NSError", "NSAppleEventManager", "NSAppleEventDescriptor", "NSNotification", "NSOperation", "block2", "objc2-core-services"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"

# winit 0.30.13 references a private CoreGraphics symbol that Mac App Store
# review refuses. This is upstream's gate (winit#4541) on that tag; delete it
# when a winit release carries the gate.
[patch.crates-io]
winit = { git = "https://github.com/excelano/winit", rev = "3cfd905679da3ca241b97dea723211b580620a27" }
